services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_pass}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventhub_user} -d ${POSTGRES_DB:-eventhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventhub_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventhub_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventhub_user}:${POSTGRES_PASSWORD:-eventhub_pass}@postgres:5432/${POSTGRES_DB:-eventhub_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 4000
      NODE_ENV: production
      EVENT_CAPACITY: ${EVENT_CAPACITY:-50}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventhub_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: eventhub_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - eventhub_network
    restart: unless-stopped

networks:
  eventhub_network:
    driver: bridge

volumes:
  postgres_data: